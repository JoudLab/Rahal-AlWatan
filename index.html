<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحّال الوطن | Rahal Al-Watan</title>
<meta name="description" content="رحّال الوطن: لعبة تفاعلية تعليمية بطابع سعودي، رحلة عبر 10 مدن و10 أسئلة عن المملكة العربية السعودية.">
<meta name="theme-color" content="#006C35">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23006C35'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 1. START -->
  <section id="start" class="screen active" aria-label="شاشة البداية">
    <div class="dots"></div>
    <div class="ghostmap" aria-hidden="true"><svg id="ghostsvg" viewBox="0 0 830 690"></svg></div>
    <h1 class="title z">رحّال الوطن</h1>
    <div class="routebar z" aria-hidden="true"><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i><b></b><i></i></div>
    <p class="tag z">10 محطات، 10 أسئلة، رحلة واحدة عبر المملكة</p>
    <div class="bot hero-bot z"><img class="bot-img" alt="رحّال الوطن، الروبوت" width="580" height="582"><span class="bot-shadow"></span></div>
    <button class="btn light z" id="playBtn" type="button">ابدأ اللعب</button>
  </section>

  <!-- 1b. SETUP (mode + names) -->
  <section id="setup" class="screen" aria-label="طريقة اللعب">
    <div class="bar"><span class="brand">رحّال الوطن</span></div>
    <div class="qwrap">
      <div class="qcard">
        <div class="qhead"><span id="setupHead">اختر طريقة اللعب</span></div>
        <div class="qbody">
          <div id="stepMode" class="modes">
            <button class="mode" type="button" id="soloBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
              لعب فردي<small>لاعب واحد يجيب عن الأسئلة العشرة</small>
            </button>
            <button class="mode" type="button" id="teamBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="3.5"/><circle cx="16.5" cy="9.5" r="3"/><path d="M2 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M15.5 14.3c.4-.1.9-.2 1.3-.2 3 0 5.2 2 5.2 5.4"/></svg>
              لعب جماعي<small>لاعبان يتناوبان على الأسئلة</small>
            </button>
          </div>
          <div id="stepNames" hidden>
            <div id="fields"></div>
            <div class="setup-actions">
              <button class="btn" id="beginBtn" type="button" disabled>ابدأ اللعب</button>
              <button class="link" id="backBtn" type="button">رجوع</button>
            </div>
          </div>
        </div>
      </div>
      <div class="bot qbot"><img class="bot-img" alt="الروبوت" width="580" height="582"><span class="bot-shadow"></span></div>
    </div>
  </section>

  <!-- 2. MAP -->
  <section id="map" class="screen" aria-label="خريطة المملكة">
    <div class="bar"><span class="brand">رحّال الوطن</span><span class="pill" id="mapPill">نقطة البداية</span></div>
    <div class="segs" id="mapSegs" aria-hidden="true"></div>
    <div class="mapcard">
      <div class="mapwrap" id="mapwrap">
        <svg id="mapsvg" viewBox="0 0 830 690" aria-hidden="true"></svg>
        <div class="mapbot bot" id="mapbot"><img class="bot-img" alt="الروبوت على الخريطة" width="580" height="582"><span class="bot-shadow"></span></div>
      </div>
    </div>
    <div class="dock">
      <div class="status" id="mapStatus" aria-live="polite"></div>
      <button class="btn" id="goBtn" type="button">انتقال إلى المرحلة الأولى</button>
    </div>
  </section>

  <!-- 3. QUESTION -->
  <section id="quiz" class="screen" aria-label="السؤال">
    <div class="bar"><span class="brand">رحّال الوطن</span><span class="pill" id="quizPill"></span></div>
    <div class="segs" id="quizSegs" aria-hidden="true"></div>
    <div class="qwrap">
      <div class="qcard">
        <div class="qhead"><span class="qn" id="qn">1</span><span id="qcity"></span></div>
        <div class="qbody">
        <div class="turn" id="turn" hidden></div>
        <h2 class="qtext" id="qtext"></h2>
        <div class="answers" id="answers"></div>
        <div class="fb" id="fb" role="status" aria-live="polite">
          <h3 class="fb-title" id="fbTitle"></h3>
          <p class="strong" id="fbSub"></p>
          <p id="fbInfo"></p>
          <button class="btn" id="nextBtn" type="button" hidden>تابع الرحلة</button>
        </div>
        </div>
      </div>
      <div class="bot qbot" id="qbot"><img class="bot-img" alt="الروبوت" width="580" height="582"><span class="bot-shadow"></span></div>
    </div>
  </section>

  <!-- 4. END -->
  <section id="end" class="screen" aria-label="نهاية الرحلة">
    <div class="dots"></div>
    <div class="bot hero-bot z" id="endbot"><img class="bot-img" alt="الروبوت يحتفل" width="580" height="582"><span class="bot-shadow"></span></div>
    <h2 class="endtitle z" id="endTitle">أحسنت!<br>لقد أكملت رحلتك بنجاح!</h2>
    <div class="endscore z"><b>10 من 10</b> محطات</div>
    <div class="results z" id="endResults"></div>
    <p class="verdict z" id="verdict" hidden></p>
    <div class="endbtns z">
      <button class="btn light" id="replayBtn" type="button">إعادة اللعب</button>
      <button class="btn ghost" id="homeBtn" type="button">العودة للرئيسية</button>
    </div>
  </section>

</div>
<div id="fx" aria-hidden="true"></div>

<script src="js/game.js"></script>
</body>
</html>
